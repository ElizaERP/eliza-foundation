# nginx/default.conf — Load balancer mínimo para el modo compose con writers
# Redirige tráfico a las réplicas de eliza-writers (Docker DNS resuelve automáticamente)

upstream eliza_writers {
  server eliza-writers:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  # Headers de proxy útiles para que la app vea la IP real del cliente
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;
  proxy_set_header Connection "";

  # Timeouts razonables
  proxy_connect_timeout 5s;
  proxy_send_timeout    30s;
  proxy_read_timeout    30s;

  # Pasar el correlation id si lo envía el cliente
  proxy_set_header X-Correlation-Id $http_x_correlation_id;

  location / {
    proxy_pass http://eliza_writers;
  }
}
