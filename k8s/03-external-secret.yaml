# =====================================================================
# ExternalSecret — sincroniza secretos desde OCI Vault hacia k8s Secret
# =====================================================================
# Requiere External Secrets Operator instalado en el cluster.
# Ver DEPLOYMENT-OCI.md sección 2.1 para la instalación.
#
# Para PRODUCCIÓN real, NUNCA pongas secretos en plano en este archivo.
# Este recurso le dice a External Secrets que vaya a Vault y construya
# el k8s Secret automáticamente.
# =====================================================================

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: oci-vault
  namespace: eliza
spec:
  provider:
    oracle:
      # Reemplazar con el OCID de tu Vault
      vault: ocid1.vault.oc1.iad.REPLACE_ME
      region: us-ashburn-1
      auth:
        secretRef:
          fingerprint:
            name: oci-auth
            key: fingerprint
          privatekey:
            name: oci-auth
            key: privateKey
          # Reemplazar con OCIDs reales
          tenancy: ocid1.tenancy.oc1..REPLACE_ME
          user: ocid1.user.oc1..REPLACE_ME
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: eliza-foundation-secrets
  namespace: eliza
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: SecretStore
  target:
    name: eliza-foundation-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: eliza-database-url

    # URL específica para migraciones (rol migration_user con DDL)
    - secretKey: DATABASE_MIGRATION_URL
      remoteRef:
        key: eliza-database-migration-url

    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: eliza-redis-password

    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: eliza-keycloak-client-secret

    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
        key: eliza-keycloak-admin-password

# =====================================================================
# ALTERNATIVA — si NO usas External Secrets Operator y prefieres
# crear el Secret manualmente con kubectl (NO recomendado para prod):
#
#   kubectl create secret generic eliza-foundation-secrets \
#     --namespace eliza \
#     --from-literal=DATABASE_URL='postgresql://...' \
#     --from-literal=DATABASE_MIGRATION_URL='postgresql://...' \
#     --from-literal=REDIS_PASSWORD='...' \
#     --from-literal=KEYCLOAK_CLIENT_SECRET='...' \
#     --from-literal=KEYCLOAK_ADMIN_PASSWORD='...'
#
# =====================================================================
